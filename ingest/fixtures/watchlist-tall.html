<!-- Test fixture only: a watchlist taller than any window, with KNOWN values and
     a unique marker per row, so scroll-and-capture coverage can be verified
     rather than assumed. Not real data. -->
<meta charset="utf-8">
<title>watchlist tall fixture</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#131722; color:#d1d4dc;
         font:14px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { width:420px; }
  .hd { position:sticky; top:0; background:#131722; display:grid;
        grid-template-columns:104px 1fr 82px 74px; padding:6px 16px; color:#787b86;
        font-size:11px; letter-spacing:.04em; text-transform:uppercase;
        border-bottom:1px solid #2a2e39; }
  .row { display:grid; grid-template-columns:104px 1fr 82px 74px; align-items:baseline;
         padding:9px 16px; border-bottom:1px solid #1e222d; }
  .sym  { font-weight:600; color:#d1d4dc; }
  .desc { color:#787b86; font-size:12px; white-space:nowrap; overflow:hidden; }
  .last { text-align:right; font-variant-numeric:tabular-nums; }
  .chg  { text-align:right; font-variant-numeric:tabular-nums; color:#26a69a; }
</style>
<div class="wrap">
  <div class="hd"><span>Symbol</span><span>Description</span><span class="last">Last</span><span class="chg">Chg%</span></div>
  <div id="rows"></div>
</div>
<script>
  /* 40 rows, price = 100 + index, so any missing row is obvious by inspection
     and total coverage is checkable arithmetically. */
  const host = document.getElementById('rows');
  for (let i = 0; i < 40; i++) {
    const sym = 'TST' + String(i).padStart(2, '0');
    const px = (100 + i).toFixed(2);
    host.insertAdjacentHTML('beforeend',
      `<div class="row"><span class="sym">${sym}</span><span class="desc">Test Instrument ${i}</span>` +
      `<span class="last">${px}</span><span class="chg">+0.10%</span></div>`);
  }
</script>
