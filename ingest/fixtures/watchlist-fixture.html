<meta charset="utf-8">

<style>

  .wrap { width:420px; padding:12px 0; }
  .hd { display:grid; grid-template-columns:104px 1fr 82px 74px;

  .last { text-align:right; font-variant-numeric:tabular-nums; }
  .chg  { text-align:right; font-variant-numeric:tabular-nums; }
  .up   { color:#26a69a; } .dn { color:#ef5350; }
</style>
