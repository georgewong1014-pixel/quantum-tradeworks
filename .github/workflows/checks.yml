name: checks

# WHY THIS EXISTS
#
# Every check in this repo already existed and every one of them ran only when
# somebody remembered. That is not a process, it is a habit, and the two failures
# it has actually produced were both silent: a build whose committed index.html
# no longer matched the source that claims to produce it, and a generated
# Content-Security-Policy that would have blocked the app's own inline script in
# production while passing locally against a stale copy of the config.
#
# Neither shows up in review. Both are one command away from being caught.
#
# The jobs are ordered by how fast they fail. syntax takes under a second and
# names the line; build --check is a hash comparison; the route sweep needs a
# browser and two minutes. There is no point paying for the browser if the file
# does not parse.

# Action versions are pinned to majors that target Node 24. v4 of checkout and
# setup-node target Node 20, which GitHub deprecated: the runner force-ran them
# on 24 and warned on every job, green or not. A warning that appears on every
# run is a warning nobody reads, so it is removed rather than lived with.
#
# setup-node is held at v5 rather than v7 on purpose — v6 changed the default
# resolution of a bare major and v7 is newer than anything this has been run
# against. v5 targets Node 24, which is the whole point of the bump.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  # A second push supersedes the first — nothing is learned from finishing a
  # sweep against a commit that is already three behind. A run started by
  # hand (journeys.yml starts one on the record it commits) has a group of
  # its own: in the push's, it cancelled the push's run of the commit before
  # it (c100b2d, 2026-10-03), whose deployment then had no checks to pass.
  group: checks-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'dispatch' || 'push' }}
  cancel-in-progress: true

jobs:
  static:
    name: parses, and matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # A syntax error in a single-file app is total: nothing renders, on every
      # route. Half a second here saves finding out from a blank page.
      - name: JavaScript parses
        run: node syntax.mjs

      # The one failure mode the src/ split introduces. index.html, 404.html,
      # the route pages under pages/, the app's script and stylesheet under
      # assets/ and vercel.json are all committed build outputs; if any drifts
      # from the source, or a page is left behind by a route that is gone, or
      # an app file by a build that is gone, what deploys is not what anybody
      # reviewed. Every page but index.html must load the current two app files
      # and weigh a page's weight, not the app's. It also holds sitemap.xml to
      # the canonical addresses the router sets.
      - name: index.html, 404.html, pages/, assets/ and vercel.json match src/
        run: node build.mjs --check

      # Every address is served what Vercel will serve it, before any script
      # runs — which is all a link preview or a crawler ever reads. A route's
      # own title, description, canonical and og: tags on its own page; the
      # generic page for /company/:id and the other parameter routes; a real
      # 404, with noindex, for an address nothing answers; a 308 for a trailing
      # slash; the data files untouched; the headers, CSP first, on every page.
      # serve.mjs answers from vercel.json by Vercel's rules, so this needs no
      # browser. `node served-check.mjs --url <site>` asks the deployed site.
      - name: every address is served its own head, and an unknown one a 404
        run: |
          nohup node serve.mjs --port 8124 > /tmp/serve-static.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:8124/ && break
            sleep 0.25
          done
          node served-check.mjs http://localhost:8124

      # The SEC ingest's selection rule — which of a concept's many reported
      # facts becomes the year's figure — on a fixture, with no network. It
      # chose a quarter-end over the year-end for balance-sheet lines for as
      # long as the file existed, and "the file parses" was the only check.
      - name: the ingest picks the year-end balance
        run: node ingest-test.mjs

      # The price-history store: the one writer of data/price-history.json.
      # The engine's validation on every row, the source-rank conflict policy
      # and its corrections, a trim that keeps volume, open/high/low and
      # provenance with the closes, the atomic write, the rejects file, and
      # every bar dated by its exchange's session in its own zone — checked
      # under two machine time zones, because the old import shifted dates
      # by the machine's zone and nothing noticed. Also the history check
      # (ingest/history-check.mjs: shifted series, sessions held twice, price
      # breaks and the adjustments that explain them) and --adjusted imports.
      - name: the price-history store validates, ranks, trims and dates bars
        run: node history-store-test.mjs

      # The same rules, over the file that ships. Every plausibility check used
      # to live in the browser, so data/us.json could hold a share count of
      # nought or a dividend in the wrong unit and nothing outside the page
      # would say so. data-check runs the ingest's own validateCompany over
      # every record, lists the cells the loader withholds by running the
      # loader's function, and fails on any hard finding not already recorded
      # — or on a recorded one that has gone, so the record stays true.
      - name: the shipped dataset passes the ingest's own validation
        run: node data-check.mjs

      # The scanner worker slices its engine out of index.html by marker and the
      # page runs the same region, so one test covers both: indicator arithmetic
      # on hand-computed series, the fixture, dedupe, cooldown, expiry, and the
      # worker's own exit codes.
      - name: the scanner engine evaluates its fixture
        run: node scanner-test.mjs

      # /status is the public statement of what works, typed by hand. This
      # holds each row to its route (an operational row must open a real
      # page), its checks (a named check must exist in the harness it names)
      # and the Phase 2 brief's release rule (priorities match the plan, every
      # brief item has a row, a partial P1 surface is feature-flagged). No
      # browser: the register and the route table are read from src/.
      - name: the capability register claims only what its routes and checks support
        run: node register-check.mjs

      # The journeys workflow commits health/journeys.json only when a status
      # or a failing step changes or the record is a day old — the rule that
      # keeps a deploy of its own commit from committing again. Offline.
      - name: the journeys' commit rule, result shape and table
        run: node journeys.mjs --self-test

      # The CSP names a hash of the inline script. If the two ever disagree the
      # site is blank in production and fine everywhere else, so it is checked
      # against the built file rather than trusted.
      - name: CSP hash covers the script that shipped
        run: |
          node -e "
            const { readFileSync } = require('fs');
            const { createHash } = require('crypto');
            const html = readFileSync('index.html', 'utf8');
            const cfg = JSON.parse(readFileSync('vercel.json', 'utf8'));
            const inline = html.slice(html.indexOf('<script>') + 8, html.lastIndexOf('<\/script>'));
            const want = 'sha256-' + createHash('sha256').update(inline, 'utf8').digest('base64');
            const csp = cfg.headers.flatMap(g => g.headers).find(h => h.key === 'Content-Security-Policy');
            if (!csp) { console.error('no Content-Security-Policy in vercel.json'); process.exit(1); }
            if (!csp.value.includes(want)) {
              console.error('CSP does not cover the inline script.');
              console.error('  needs  ' + want);
              console.error('  has    ' + (csp.value.match(/sha256-[A-Za-z0-9+/=]+/) || ['(none)'])[0]);
              process.exit(1);
            }
            console.log('CSP hash matches the shipped script.');
          "

      # The licensed lane must never reach a public checkout. This is the one
      # check whose failure is not a bug but a disclosure.
      # Section 13 of the NAPIC extraction spec bans phrases the licensed data
      # cannot support. "Last transacted price" is the natural thing to type and
      # wrong for a reason invisible in the sentence, so it is checked.
      - name: no banned claim wording
        run: node wording-check.mjs

      # The extraction must still reconcile to the published Sarawak totals.
      - name: NAPIC extract reconciles
        run: |
          if [ -d property-data/raw ]; then node napic-ingest.mjs --check; else
          echo "raw NAPIC sources are not in this checkout (they are licence-pending and git-ignored) — skipping"; fi

      - name: no licensed data is committed
        run: |
          node -e "
            const { execSync } = require('child_process');
            const BANNED = ['data/prices.json','data/personal-prices.json','data/price-history.json',
                            'data/price-adjustments.json',
                            'data/personal-fundamentals.json','data/sarawak-income.json',
                            'data/scan-setups.json','data/scan-alerts.json','data/scan-alerts.json.bak','data/scan-alerts.json.tmp',
                            'data/price-history.json.bak','data/price-history.json.tmp','data/price-history.rejects.json',
                            'data/scan-runs.json','data/scan.lock','data/scan-control.json','data/scan-deliveries.json','data/ingest-runs.json',
                            'data/scan-ledger.json','data/watchlists.json',
                            'watchlist-symbols.txt','qtti/observations.json','qtti/observations.draft.json'];
            // Every directory and pattern .gitignore marks as licensed or
            // personal. The NAPIC raw sources and the capture profile (live
            // session cookies) were ignored but not checked, so a git add -f
            // of either passed this gate.
            const PATTERNS = [/^watchlist-shots\//, /^qtti\/screenshots\//, /^qtti\/out\//,
                              /^property-data\/(raw|staging|normalized|rejects)\//,
                              /^\.chrome-watchlist\//, /\.state\.json$/, /^data\/watchlist-review[^/]*\.(csv|txt)$/,
                              /^data\/price-adjustments\.json(\.|$)/,
                              /^data\/(price-history(\.rejects)?\.json|scan-(runs|control|deliveries)\.json|scan\.lock|ingest-runs\.json)(\.|$)/,
                              /^data\/(scan-ledger|watchlists)\.json(\.|$)/];
            const tracked = execSync('git ls-files', { encoding: 'utf8' }).split('\n');
            const bad = BANNED.filter(f => tracked.includes(f));
            const shots = tracked.filter(f => PATTERNS.some(re => re.test(f)));
            if (bad.length || shots.length) {
              console.error('licensed or personal data is tracked by git:');
              [...bad, ...shots].forEach(f => console.error('  ' + f));
              process.exit(1);
            }
            console.log('no licensed data tracked.');
          "

  runtime:
    name: every route renders
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The tools resolve a browser from CHROME_PATH first, then a list of known
      # locations. Relying on the list is relying on where this action happens to
      # install today — it already caught us once, when a Windows-only list met a
      # Linux runner. So the path the action reports is exported explicitly and
      # nothing has to guess.
      - name: install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: point the tools at it
        run: |
          echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          "${{ steps.chrome.outputs.chrome-path }}" --version

      # serve.mjs applies the generated headers, so the sweep runs under the
      # real Content-Security-Policy rather than a permissive local one.
      - name: serve
        run: |
          nohup node serve.mjs --port 8123 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 40); do
            curl -sf -o /dev/null http://localhost:8123/ && break
            sleep 0.25
          done
          curl -sI http://localhost:8123/ | grep -i content-security-policy

      # Console errors, page exceptions, failed requests, CSP violations,
      # NaN/undefined rendered as values, and horizontal overflow — per route.
      - name: route sweep
        run: node sweep.mjs http://localhost:8123

      # A route may state one answer to a question, or none. This catches the
      # class of bug where a page is briefly wrong before settling — invisible
      # to any check that waits for the page to settle.
      - name: no route contradicts itself
        run: node coverage-frames.mjs http://localhost:8123

      # Record, edit, undo and replay across every logged entity. The other
      # checks all look at a PAGE; this looks at a SEQUENCE, which is where one
      # feature meeting another written on a different day goes wrong. A demand
      # record silently disabled undo for the whole register and every check
      # here stayed green through three commits.
      - name: the register survives record, edit, undo and replay
        run: node register-test.mjs http://localhost:8123
      # register-test drives a SEQUENCE; this drives ARITHMETIC. Every check in
      # it is a definition rather than an expected value — the NPV of the
      # published flows at the published IRR must be zero, the break-even rent
      # must be a true zero of the monthly position — so it does not go stale
      # when a default is tuned, and it fails only when a figure stops being
      # the quantity its label claims. That is the failure this product can
      # least afford: a number that is plausible, sits in the right place and
      # moves the right way, and is not what it says it is.
      - name: every published figure is the quantity its label claims
        run: node model-test.mjs http://localhost:8123

      # The equities side had no arithmetic check at all, and 119 filed
      # companies shipped for two months with ten of them labelled a year
      # early and four places reading an absent line as nought. None of that
      # throws or renders NaN, so the sweep passed. This asks the definitions:
      # a derived line is null exactly when an input is, a split withholds
      # every per-share rate, a label is the company's own — and pins three
      # revenue figures to their filings, looked up by fiscal-year label.
      # It also carries the Phase 2 research QA checklist (docs/phase2-qa.md):
      # every filer's statement table against data/us.json, ratios against
      # the 10-Ks, persistence across a reload, exports against the table,
      # the watchlist contract, and the loading and failed-load states.
      - name: the filed statements are labelled and derived as they claim
        run: node equity-test.mjs http://localhost:8123

      # 360 · 390 · 430 · 768 · 1024 · 1440. The sweep only ever looks at the
      # default width, so a table that gained a column pushes the page sideways
      # on a phone and every other check still passes — which is exactly how the
      # decision record shipped 186px of overflow at 390.
      - name: no horizontal overflow at any width
        run: node mobile.mjs http://localhost:8123

      # Every check above looks at a page. These are journeys: find a company
      # and its filed statements and keep it on a list, filter the screener
      # and open a result, model a property and save it, build a scanner
      # setup, save it and evaluate it, press every primary call to action —
      # by real clicks, passing only when the whole path completes. The same
      # script runs against the live site after each production deployment
      # (journeys.yml); here the personal lane is answered 404 in the browser
      # and the scanner reads a synthetic history made from its engine's
      # fixture, so the evaluate step has to find the match.
      - name: every tool works from start to finish
        run: node journeys.mjs http://localhost:8123
