name: journeys

# WHY THIS EXISTS
#
# checks.yml asks whether the commit is right before it ships. Nothing asked
# whether the site that shipped works: that a reader can find a company and
# read where its figures came from, model and save a property, build and save
# a scanner setup, and press each primary call to action and land on a page.
# journeys.mjs asks exactly that, in real Chrome, of the live site — and
# /status shows the answer, in its served HTML and again as its script reads
# health/journeys.json.
#
# It runs
#   - after every successful PRODUCTION deployment. Vercel's GitHub
#     integration creates a GitHub deployment for each deploy and reports its
#     states as deployment_status events. The payload used here:
#       github.event.deployment_status.state          'success' once it is live
#       github.event.deployment.environment           'Production' (or
#                                                     'Production – <project>'
#                                                     where a repo has several)
#       github.event.deployment.production_environment  true for production
#       github.event.deployment.sha                   the commit deployed
#     Previews, and the pending/in_progress/failure states, are skipped;
#   - twice a day on a schedule (03:17 and 15:17 UTC), so a site nobody
#     deployed is still looked at, and its record is never a day old even
#     when GitHub starts a scheduled run six or seven hours late (it started
#     the old 03:17 run between 09:11 and 10:11 on 1–4 Oct 2026);
#   - by hand (workflow_dispatch).
#
# What it writes
#   - the job summary: a table of every journey, its status, failing step,
#     route and time;
#   - ONE issue titled "Production journeys failing": opened on the first
#     FAIL, its body replaced by the latest table while it fails, closed with
#     a comment by the next run in which every journey passes;
#   - health/journeys.json on main, with what started the run (trigger) and
#     the run's public log (run), and the island pages rebuilt from it in the
#     same commit — /status's served result and the one-line result on the
#     /property, /research and /app/scanner pages (node build.mjs). Recorded
#     after every production deployment that changes the app, on every
#     scheduled run and on a run started by hand (D16, the owner's decision
#     of 5 Oct 2026; journeys.mjs --decide holds the rule, its --self-test
#     the cases). Until 6 Oct 2026 it was recorded only when a status changed
#     or the record was a day old, and three code deployments in a row went
#     unrecorded;
#   - health/checks.json, in the same commit: checks.yml's suites on the
#     commit the site serves — Numbers, Data, and Layout & served pages,
#     each suite's counts as it printed them — read from the annotations its
#     jobs leave (checks-record.mjs collect). /status publishes the four
#     kinds separately; a suite with no result for that commit reads "Not
#     run for <commit>", never PASS.
#
# LOOP SAFETY. That commit is deployed like any other (the file and the pages
# have to be on the site), and its deployment runs this workflow again. That
# run still writes its summary and keeps the issue, but it records nothing:
# the deployed commit changed only the records (health/journeys.json and
# health/checks.json) and — written by github-actions[bot] — the island
# pages, so it serves the same app as the
# deployment before it (decide's ownRecord rule, held by journeys.mjs
# --self-test). A status that flaps — a step a second over budget is
# DEGRADED on one run and PASS on the next — therefore makes at most one
# extra deployment, whatever the second run finds. A deployment whose
# changed files cannot be listed records nothing either.
#
# Permissions are the three it uses and nothing else: contents (the commit),
# issues (the issue) and actions (starting checks.yml on the commit). The
# job's concurrency group keeps two runs from racing to commit; a push that
# loses to a developer's starts again from main as it is now — fetch, reset,
# copy the record, rebuild — never `git pull --rebase`, which would conflict
# on the island pages. People merging main follow the same rule (fetch and
# merge --ff-only); an island page in conflict is resolved by node build.mjs.

on:
  deployment_status:
  schedule:
    - cron: '17 3,15 * * *'   # 03:17 and 15:17 UTC, 11:17 and 23:17 in Kuching
  workflow_dispatch:

# THE GATE BEFORE THIS ONE. With Vercel's Deployment Checks on (Project →
# Settings → Build and Deployment → Deployment Checks: GitHub, the three jobs
# of checks.yml — "parses, and matches its source", "every route renders" and
# "every tool works from start to finish"), Vercel holds each production
# deployment until those pass on its commit, and only then serves it: the
# journeys in checks.yml run against that commit's own files first, so a
# commit whose journeys fail never goes live. This workflow is what follows
# the release — the same journeys against the live site. Two consequences
# here:
#   - a deployment's run waits up to an hour for the site to serve its build
#     (the checks take 39 to 52 minutes), inside a 75-minute job;
#   - the record this workflow commits is pushed with its own token, and a
#     push made with it starts no workflow — so checks.yml would never run on
#     it, and its deployment would wait for checks that never come. It starts
#     them itself (actions: write). The commit no longer says [skip ci]: its
#     checks are what Deployment Checks promotes it on.
#
# checks: read (10 Oct 2026) reads the annotations checks.yml leaves on the
# served commit — each suite's result — into health/checks.json.
permissions:
  actions: write
  checks: read
  contents: write
  issues: write

jobs:
  journeys:
    name: complete journeys on the live site
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.production_environment == true ||
      startsWith(github.event.deployment.environment, 'Production')))
    # The JOB's group, not the workflow's. A group holds one run in progress
    # and one pending, and a newer pending run cancels the older. At the
    # workflow level every deployment_status event joins it — each preview
    # deployment of every pushed branch, and each deployment's pending
    # status — so a production deployment's run waiting behind a nightly one
    # was cancelled by the next preview event, whose job is then skipped:
    # the deployment was never looked at. A job skipped by the if above
    # never joins the job's group.
    concurrency:
      group: journeys
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Up to an hour waiting for a held deployment to go live, then the run,
    # then up to 50 minutes for checks.yml to finish on the served commit
    # where Deployment Checks did not already hold the deployment for it.
    timeout-minutes: 140
    env:
      # What started the run, and its public log: both are recorded.
      TRIGGER: ${{ github.event_name == 'deployment_status' && 'deployment' || github.event_name == 'schedule' && 'schedule' || 'dispatch' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # main, whatever triggered the run: the result is committed on top of it,
      # and the whole history is there to match the served build to a commit.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
      - name: point the tools at it
        run: |
          echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          "${{ steps.chrome.outputs.chrome-path }}" --version

      # --url production is the template's canonical origin. After a
      # deployment, --commit waits (up to an hour: a deployment held for its
      # Deployment Checks goes live only once checks.yml passes on it) for
      # the site to serve that commit's build before the journeys start, and
      # records it as served; a build not served by then is recorded as what
      # the site did serve. The exit code is kept for the last step, so a
      # failing run still writes its summary, its issue and its record.
      - name: run the journeys against the live site
        id: run
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          set +e
          node journeys.mjs --url production \
            --trigger "$TRIGGER" --run "$RUN_URL" \
            --json "$RUNNER_TEMP/journeys.json" --markdown "$RUNNER_TEMP/journeys.md" \
            ${DEPLOY_SHA:+--commit "$DEPLOY_SHA" --wait 3600}
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/journeys.md" ]; then
            cat "$RUNNER_TEMP/journeys.md" >> "$GITHUB_STEP_SUMMARY"
            printf '\n[This run](%s/%s/actions/runs/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$RUNNER_TEMP/journeys.md"
          else
            echo "journeys.mjs wrote no result — the log of the step above says why." >> "$GITHUB_STEP_SUMMARY"
          fi

      # The rule lives in journeys.mjs (decide) so it is tested offline:
      # record after a deployment that changed the app, on a scheduled run
      # and on a run by hand. After a deployment, the paths its commit
      # changed and its author go with the result: a deployment of the
      # record's own commit (only the record, and the island pages by
      # github-actions[bot]) records nothing, so a status that flaps cannot
      # loop.
      - name: decide what to record
        id: decide
        if: always()
        env:
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
        run: |
          if [ ! -f "$RUNNER_TEMP/journeys.json" ]; then
            echo "noresult=true" >> "$GITHUB_OUTPUT"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show origin/main:health/journeys.json > "$RUNNER_TEMP/recorded.json" 2>/dev/null || rm -f "$RUNNER_TEMP/recorded.json"
          deployed=''
          author=''
          if [ -n "$DEPLOY_SHA" ] && git diff --name-only "$DEPLOY_SHA^" "$DEPLOY_SHA" > "$RUNNER_TEMP/deployed-files.txt" 2>/dev/null; then
            deployed="$RUNNER_TEMP/deployed-files.txt"
            author=$(git log -1 --format='%an' "$DEPLOY_SHA")
          fi
          node journeys.mjs --decide "$RUNNER_TEMP/recorded.json" "$RUNNER_TEMP/journeys.json" --trigger "$TRIGGER" ${deployed:+--deployed-files "$deployed"} ${author:+--deployed-author "$author"} | tee -a "$GITHUB_OUTPUT"

      - name: open, update or close the issue
        if: always() && steps.decide.outputs.noresult != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILS: ${{ steps.decide.outputs.fails }}
          ALL_PASS: ${{ steps.decide.outputs.all_pass }}
          RAN_AT: ${{ steps.decide.outputs.ran_at }}
          SERVED: ${{ steps.decide.outputs.commit_served }}
        run: |
          title='Production journeys failing'
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
                  --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "${FAILS:-0}" -gt 0 ]; then
            if [ -n "$num" ]; then
              gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/journeys.md"
              echo "updated #$num"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/journeys.md"
            fi
          elif [ "$ALL_PASS" = "true" ] && [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" \
              --comment "Every journey passes again — run of $RAN_AT against the live site${SERVED:+, commit ${SERVED:0:12}}. $run_url"
          else
            echo "no issue to open or close (fails=${FAILS:-0}, all_pass=${ALL_PASS:-false}, open issue: ${num:-none})"
          fi

      # WHAT CI FOUND ON THE SERVED COMMIT (the daily audit of 10 Oct 2026,
      # items 3 and 7). /status publishes Journeys, Numbers, Data, and Layout
      # & served pages separately. The journeys are this run's; the other
      # three are checks.yml's suites on the commit the site serves (the
      # record's commit_served), read from the annotations each of its jobs
      # leaves (checks-record.mjs summarize) — public, so nothing is
      # downloaded. A run still going on that commit is waited for, up to 50
      # minutes (a deployment Deployment Checks did not hold goes live before
      # its checks end); a suite with no result reads NOT RUN, never PASS.
      # Only when the journeys are recorded, and into the same commit: no
      # second record, no second deployment, the same loop guard. The step
      # never fails the run — a record it cannot read says so.
      - name: collect the checks of the served commit
        if: always() && steps.decide.outputs.commit == 'true'
        env:
          SERVED: ${{ steps.decide.outputs.commit_served }}
          GH_TOKEN: ${{ github.token }}
        run: node checks-record.mjs collect --commit "$SERVED" --repo "$GITHUB_REPOSITORY" --out "$RUNNER_TEMP/checks.json" --wait 3000

      # The record and the island pages rebuilt from it, in one commit by
      # github-actions[bot], on top of main as it is now:
      #   1. copy the record over health/journeys.json, and CI's results on
      #      the served commit over health/checks.json;
      #   2. node build.mjs, which writes it into /status and the three
      #      product landing pages (no browser: the renders are committed);
      #   3. node journeys.mjs --guard: the tree changes the record and those
      #      pages and nothing else, or nothing is committed;
      #   4. commit — with no [skip ci], so its checks run.
      # A push lost to another starts again from fresh main (fetch, reset,
      # 1–4), never git pull --rebase. The record is pushed with this
      # workflow's token, which starts no workflow; checks.yml is started on
      # it by hand, so the deployment of the record can pass its Deployment
      # Checks and go live.
      - name: record the result on main
        if: always() && steps.decide.outputs.commit == 'true'
        env:
          SUMMARY: ${{ steps.decide.outputs.summary }}
          WHY: ${{ steps.decide.outputs.why }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          record() {
            mkdir -p health || return 2
            cp "$RUNNER_TEMP/journeys.json" health/journeys.json || return 2
            # With no checks record (the collect step could not write one),
            # health/checks.json stays as it was: for another commit, so
            # /status reads "Not run for" the served one.
            if [ -f "$RUNNER_TEMP/checks.json" ]; then cp "$RUNNER_TEMP/checks.json" health/checks.json || return 2; fi
            node build.mjs > "$RUNNER_TEMP/build.log" 2>&1 || { cat "$RUNNER_TEMP/build.log"; return 2; }
            node journeys.mjs --guard || return 2
            git add -A || return 2
            git commit -q -m "chore(health): production journeys — $SUMMARY" -m "$WHY" -m "Written by .github/workflows/journeys.yml from journeys.mjs --url production, with checks.yml's results on the served commit (checks-record.mjs collect, health/checks.json) and the island pages node build.mjs rebuilt from both."
          }
          record || exit 1
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref main || echo "could not start checks.yml on the recorded commit"
              exit 0
            fi
            sleep $((i * 5))
            git fetch -q origin main
            git reset -q --hard origin/main
            record || exit 1
          done
          echo "could not push the result after 5 attempts"
          exit 1

      - name: fail the run when a journey failed
        if: always()
        run: |
          code="${{ steps.run.outputs.exit }}"
          if [ "$code" != "0" ]; then
            echo "a journey failed, or the journeys could not run (journeys.mjs exited ${code:-without a code})"
            exit 1
          fi
